name: Verify mathematical controls

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Check exact identities and high-precision recovery controls
        run: |
          python scripts/verify_recovery.py
          python scripts/verify_direct_stability.py
          python scripts/verify_scale_jets.py
          julia --startup-file=no julia/verify_exact.jl
      - uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Check the symbolic double-pole identities in Lean
        run: |
          set -o pipefail
          lean lean/ScaleJets.lean | tee reports/lean-axioms.txt
